<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Roadmap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Music Roadmap</h1>
    <input id="search" type="search" placeholder="Search by song, artist, album or a lyric line…" autocomplete="off">
  </header>

  <main>
    <aside id="filters" aria-label="Filters"></aside>

    <section aria-label="Songs">
      <p id="count"></p>
      <ul id="songs"></ul>
    </section>

    <aside id="queue" aria-label="Your queue">
      <h2>Queue <span id="queue-count">0</span></h2>
      <ol id="queue-list"></ol>
      <div class="actions">
        <button id="play-youtube">Play on YouTube</button>
        <button id="play-spotify">Open in Spotify</button>
        <button id="copy-list">Copy list</button>
        <button id="clear-queue" class="ghost">Clear</button>
      </div>
      <p id="queue-note"></p>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
